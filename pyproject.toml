[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "truthclf"
version = "0.1.0"
description = "Binary truthfulness classification of public statements: zero-shot + fine-tuned predictors and a faithfulness-aware explainer."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Satalia DS Challenge submission" }]

# Floors match the versions this was developed and tested against (see README).
# scikit-learn / scipy / statsmodels are first-class dependencies, not optional:
# the metrics, calibration, threshold and split code defers to their reference
# implementations rather than hand-rolling numerical routines.
dependencies = [
    "diskcache>=5.6",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "together>=2.0",
    "tiktoken>=0.7",
    "python-dotenv>=1.0",
    "pandas>=2.0",
    "tenacity>=9.1.4",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["truthclf", "truthclf.predictors"]

[tool.pytest.ini_options]
testpaths = ["tests"]
