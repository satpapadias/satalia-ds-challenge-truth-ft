[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "truthclf"
version = "0.1.0"
description = "Binary truthfulness classification of public statements: zero-shot + fine-tuned predictors and a faithfulness-aware explainer."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Satalia DS Challenge submission" }]

# Floors match the versions this was developed and tested against (see README).
# scikit-learn / scipy / statsmodels are first-class dependencies, not optional:
# the metrics, calibration, threshold and split code defers to their reference
# implementations rather than hand-rolling numerical routines.
dependencies = [
    "diskcache>=5.6",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "together>=2.0",
    "tiktoken>=0.7",
    "python-dotenv>=1.0",
    "pandas>=2.0",
    "tenacity>=9.1.4",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.7",
    "python-pptx>=1.0.2",
]
dev = ["pytest>=7.0"]
mcp = [
    "mcp>=1.2",
]

# The agents are a separate deployable with a separate dependency set. Declared
# as a group rather than an extra so it can be installed on its own, WITHOUT the
# truthclf package and its data-science stack: `uv sync --only-group agents`.
# That is what lets the agent image be built unable to import truthclf at all,
# which turns "agents are pure MCP clients" from a convention into a property
# the build checks.
[dependency-groups]
agents = [
    "a2a-sdk>=1.1.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=1.2",
]

[tool.setuptools]
# truthclf_agents is deliberately NOT part of this distribution. The agents are
# a separate deployable that must not depend on truthclf, and listing them here
# would make installing truthclf drag the agent package along -- and would make
# the tools image fail to build without agent sources it has no reason to carry.
# They are run from the working directory instead (`python -m truthclf_agents.*`).
packages = ["truthclf", "truthclf.predictors", "truthclf_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
