[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "truthclf"
version = "0.1.0"
description = "Binary truthfulness classification of public statements: zero-shot + fine-tuned predictors and a faithfulness-aware explainer."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Satalia DS Challenge submission" }]

# Floors match the versions this was developed and tested against (see README).
dependencies = [
    "numpy>=1.24",
    "together>=2.0",
    "python-dotenv>=1.0",
    "pandas>=2.0",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["truthclf", "truthclf.predictors"]

[tool.pytest.ini_options]
testpaths = ["tests"]
